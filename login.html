<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Work Phase 4</title>
    <link rel="stylesheet" href="css/reset.css" />
    <link rel="stylesheet" href="css/base.css" />
    <link rel="stylesheet" href="css/layout.css" />
    <link rel="stylesheet" href="css/components.css" />
    <link rel="stylesheet" href="css/page_css/login.css">

</head>

<body>
    <main>
        <a href="./home.html">
            <button class="button-primary" style="margin: 20px;">⬅ Go Back</button>
        </a>
        <div class="container">
            
            <form id="community-form" enctype="multipart/form-data">

                <label for="name">Full Name:</label>
                <input type="text" id="name" name="name" placeholder="Enter your full name" required />

                <label for="email">Email Address:</label>
                <input type="email" id="email" name="email" placeholder="you@example.com" required />

                <label for="message">Message:</label>
                <input type="text" id="message" name="message" placeholder="Leave a message as you like ~" required />

                <label for="address">Address:</label>
                <input type="text" id="address" name="address" placeholder="Enter your address" />

                <label for="photo">Upload photo:</label>
                <input type="file" id="photo" name="photo" accept="image/*" />
                <!-- <label for="default">No file chosen</label> -->

                <button type="submit" class="button-primary form-button">
                    Join the Community
                </button>
            </form>
            <p id="form-feedback" aria-live="polite"></p>
        </div>
    </main>
    <script type="module" src="js/login.js"></script>
</body>

</html>
